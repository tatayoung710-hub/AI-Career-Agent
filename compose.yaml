services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: career
      POSTGRES_USER: career
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://career:${POSTGRES_PASSWORD}@database:5432/career
      STORAGE_DIR: /app/data
    volumes:
      - career_files:/app/data
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
  worker:
    build: ./backend
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://career:${POSTGRES_PASSWORD}@database:5432/career
      STORAGE_DIR: /app/data
    command: ["python", "-m", "app.worker"]
    volumes:
      - career_files:/app/data
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  career_files:
