[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-career-agent"
version = "0.1.0"
description = "Evidence-grounded career coaching, resume tailoring and application orchestration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "openai>=1.60,<3",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "pypdf>=5,<7",
  "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "reportlab>=4.2,<5",
  "beautifulsoup4>=4.12,<5", "defusedxml>=0.7,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
